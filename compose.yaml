services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: SIMS
        restart: unless-stopped
        working_dir: /var/www
        env_file:
            - .env
        volumes:
            - .:/var/www
        depends_on:
            - redis
        networks:
            - sims

    nginx:
        image: nginx:1.28-alpine
        container_name: SIMS-NGINX
        restart: unless-stopped
        ports:
            - "8000:80"
        volumes:
            - .:/var/www
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks:
            - sims

    node:
        image: node:22-alpine
        container_name: SIMS-NODE
        working_dir: /var/www
        volumes:
            - .:/var/www
            - /var/www/node_modules
        ports:
            - "5173:5173"
        command: sh -c "npm install && npm run dev -- --host"
        networks:
            - sims

    redis:
        image: redis:8-alpine
        container_name: SIMS-REDIS
        restart: unless-stopped
        networks:
            - sims

networks:
    sims:
        driver: bridge
